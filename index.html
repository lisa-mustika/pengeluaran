<!DOCTYPE html>
<html lang="id">
<head>
  <title>Catatan Pengeluaran Bulanan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <style>
    /* RESET */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      /* Pakai dvh (dynamic viewport height) supaya menyesuaikan address bar HP,
         dengan fallback ke vh untuk browser lama yang belum support dvh */
      height: 100vh;
      height: 100dvh;
      background: black;
      /* Izinkan halaman ini discroll jika suatu saat kontennya melebihi layar */
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* IFRAME FLEKSIBEL, TIDAK DIPAKSA FIXED FULLSCREEN */
    iframe {
      display: block;
      width: 100%;
      /* Tinggi minimal 1 layar penuh, tapi boleh lebih tinggi jika konten
         di dalam web app butuh ruang lebih (efeknya: body ikut discroll) */
      min-height: 100vh;
      min-height: 100dvh;
      height: 100dvh;
      border: none;
    }
  </style>
</head>
<body>
  <iframe
    id="timerFrame"
    src="https://script.google.com/macros/s/AKfycbwA2Pk8LRMgq91Iptp_rS-iQdgBwszFPq2FrxyQzWmE9GkPf18alP-OwTxFUO8sgVKPGQ/exec"
    allowfullscreen
    scrolling="yes"
    loading="eager">
  </iframe>
  <script>
    // Fullscreen hanya bisa dipicu oleh interaksi user (aturan browser)
    document.addEventListener('click', () => {
      const iframe = document.getElementById('timerFrame');
      if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
      }
    });
  </script>
</body>
</html>
